name: twingle_mobile
description: "Twingle - The No. 1 Mallu Dating App for Malayalis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_card_swiper: ^7.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  web_socket_channel: ^2.4.0
  # For toast/snackbars
  fluttertoast: ^8.2.4
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
