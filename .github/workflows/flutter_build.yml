name: Flutter Build Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # A good open-jdk distro for Android builds
          java-version: '17'
          cache: 'gradle'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get
          
      - name: Build APK # Also generating app bundle for play store if needed, but APK first
        run: |
          cd mobile
          flutter build apk --release
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: twingle-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get
          
      - name: Build iOS (No Codesign)
        run: |
          cd mobile
          flutter build ios --release --no-codesign
          
      - name: Upload unsigned iOS App artifact
        uses: actions/upload-artifact@v4
        with:
          name: twingle-ios-app
          path: mobile/build/ios/iphoneos/Runner.app
